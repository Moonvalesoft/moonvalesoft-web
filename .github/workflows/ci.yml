name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: moonvale
          POSTGRES_PASSWORD: moonvale
          POSTGRES_DB: moonvale_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moonvale" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://moonvale:moonvale@localhost:5432/moonvale_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
