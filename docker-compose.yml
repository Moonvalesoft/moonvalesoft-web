# Geliştirme ortamı: docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: moonvale
      POSTGRES_PASSWORD: moonvale
      POSTGRES_DB: moonvale_web
      # db/init/01-roles.sh bu parolalarla mv_migrator ve mv_api kullanıcılarını açar (yalnız ilk açılışta).
      MV_MIGRATOR_PASSWORD: mv_migrator_dev
      MV_API_PASSWORD: mv_api_dev
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/db/init:/docker-entrypoint-initdb.d:ro
      - ./apps/api/db/roles.sql:/mv/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonvale"]
      interval: 5s
      retries: 10
  mail:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  pgdata:
