# Geliştirme ortamı: docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: moonvale
      POSTGRES_PASSWORD: moonvale
      POSTGRES_DB: moonvale_web
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonvale"]
      interval: 5s
      retries: 10
  mail:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  pgdata:
